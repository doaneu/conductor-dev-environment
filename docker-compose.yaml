version: '2.3'

services:
  conductor-server:
    environment:
      - CONFIG_PROP=config-postgres.properties
    image: doaneu/conductor.server:main
    restart: always
    networks:
      - internal
    ports:
      - 8080:8080
      - 5000:5000
    healthcheck:
      test: ["CMD", "curl","-I" ,"-XGET", "http://localhost:8080/health"]
      interval: 60s
      timeout: 30s
      retries: 12
    depends_on:
      postgresdb:
        condition: service_healthy  
    logging:
      driver: "json-file"
      options:
        max-size: "1k"
        max-file: "3"
 
