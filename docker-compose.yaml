version: '2.3'

services:
  conductor-server:
    environment:
      - CONFIG_PROP=config-postgres.properties
    image: doaneu/conductor.server:main
    restart: always
    networks:
      - internal
    ports:
      - 8080:8080
      - 5000:5000
    healthcheck:
      test: ["CMD", "curl","-I" ,"-XGET", "http://localhost:8080/health"]
      interval: 60s
      timeout: 30s
      retries: 12
    depends_on:
      postgresdb:
        condition: service_healthy  
    logging:
      driver: "json-file"
      options:
        max-size: "1k"
        max-file: "3"
 
  postgresdb:
    environment:
      - POSTGRES_USER=conductor
      - POSTGRES_PASSWORD=conductor
    volumes:
      - pgdata-conductor:/var/lib/postgresql/data
    image: postgres:16.4-alpine3.20
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conductor"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    ports:
      - 5432
    
volumes:
  pgdata-conductor:
    driver: local

networks:
  internal: